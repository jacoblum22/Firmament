services:
  firmament-api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/uploads:/var/uploads
      - ./backend/temp_chunks:/var/temp
      - ./backend/logs:/var/log/firmament
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Default password avoids Compose warnings when REDIS_PASSWORD is unset.
    # Override in production: set REDIS_PASSWORD in a .env next to this file, and
    # use the same value in backend/.env.production REDIS_URL (redis://:PASS@redis:6379/0).
    command: redis-server --requirepass ${REDIS_PASSWORD:-firmament_local_dev_redis}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL: add back when database layer is implemented

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/ssl:/etc/nginx/ssl
    depends_on:
      - firmament-api
    restart: unless-stopped

volumes:
  redis_data:
